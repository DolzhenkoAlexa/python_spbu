name: Run Heap Sort Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install pytest
      run: pip install pytest
    
    - name: Run tests
      run: |
        python -m pytest tests_heapsort.py -v

